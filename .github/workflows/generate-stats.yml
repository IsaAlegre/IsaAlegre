name: Generate GitHub Stats

on:
  schedule:
    - cron: '0 0 * * 1'
  workflow_dispatch:

jobs:
  generate:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    
    steps:
      - uses: actions/checkout@v3
      
      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.11'
      
      - name: Install dependencies
        run: pip install requests
      
      - name: Generate stats SVG
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_USERNAME: isaAlegre
        run: |
          python scripts/generate-stats.py
          ls -la stats.svg || echo "ERROR: stats.svg not created!"
      
      - name: Commit and push
        if: always()
        run: |
          git config --local user.email "action@github.com"
          git config --local user.name "GitHub Action"
          if [ -f stats.svg ]; then
            git add stats.svg
            git commit -m "Update GitHub stats" || echo "No changes"
            git push
          else
            echo "stats.svg not found!"
          fi